[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "python-dependency-linter"
dynamic = ["version"]
description = "A dependency linter for Python projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
pdl = "python_dependency_linter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "ty>=0.0.26",
    "pre-commit>=3.0",
]

[tool.hatch.version]
source = "vcs"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["python_dependency_linter"]

[tool.ty.src]
exclude = ["tests/fixtures/"]

[tool.ty.rules]
unresolved-import = "ignore"  # tomllib/tomli compatibility pattern

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.git-cliff.changelog]
header = """# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/heumsi/python-dependency-linter
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat=":") | last | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
  { pattern = ' *(:\w+:|[\p{Emoji_Presentation}\p{Extended_Pictographic}]\u{FE0F}?\u{200D}?) *', replace = "" },
]
commit_parsers = [
  { message = "^.*Update CHANGELOG", skip = true },
  { message = "^.*feat", group = "Features" },
  { message = "^.*fix", group = "Bug Fixes" },
  { message = "^.*refactor", group = "Refactor" },
  { message = "^.*perf", group = "Performance" },
  { message = "^.*doc", group = "Documentation" },
  { message = "^.*test", group = "Testing" },
  { message = "^.*chore", group = "Miscellaneous" },
  { message = "^.*ci", group = "CI/CD" },
]
tag_pattern = "v[0-9].*"
