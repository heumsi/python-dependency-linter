name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      # Pulled into the docs site via pymdownx.snippets.
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      # Changing how the site is built should redeploy it too.
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

# Allow only one concurrent deployment, and let in-flight ones finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv pip install --system mkdocs mkdocs-shadcn
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
