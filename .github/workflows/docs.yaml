name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv pip install --system mkdocs mkdocs-shadcn
      - run: mkdocs gh-deploy --force
