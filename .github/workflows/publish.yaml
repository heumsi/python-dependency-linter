name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  # CHANGELOG.md is committed by the maintainer before tagging, so the tagged
  # commit already contains it. See the Release section in CONTRIBUTING.md.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Ensure the changelog was updated for this tag
        run: |
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME}. See the Release section in CONTRIBUTING.md."; exit 1; }
      - name: Generate release notes
        id: release_notes
        uses: orhun/git-cliff-action@v4
        with:
          config: pyproject.toml
          args: --verbose --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
